name: Trading bot tests

on:
  push:
    paths:
      - 'gold_bot/**'
      - 'run_bot.py'
      - 'tests/**'
      - 'robot*.json'
      - '.github/workflows/trading-tests.yml'
  pull_request:
    paths:
      - 'gold_bot/**'
      - 'run_bot.py'
      - 'tests/**'
      - 'robot*.json'
      - '.github/workflows/trading-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q gold_bot run_bot.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JSON configuration validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').glob('robot*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - name: Bitvavo configuration validation
        run: |
          python - <<'PY'
          from gold_bot.settings import BotConfig
          cfg = BotConfig.load('robot.bitvavo.json')
          problems = cfg.validate()
          if problems:
              raise SystemExit('\n'.join(problems))
          assert cfg.engine.broker == 'bitvavo'
          print('OK: Bitvavo configuration coherent')
          PY
