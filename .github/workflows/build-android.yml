# Construit l'APK Android SANS passer par EAS Build (Expo).
#
# POURQUOI CE FICHIER EXISTE. Le compte Expo a epuise son quota gratuit
# de constructions ce mois-ci (14 sept. 2026, reinitialisation le
# 1er octobre). Deux alternatives ecartees :
#   - construire sur le VPS du robot : cette machine tourne le robot en
#     argent reel, avec tres peu de memoire libre et aucune memoire
#     d'echange -- une construction Gradle pourrait l'affamer au pire
#     moment ;
#   - payer un abonnement Expo : evitable, GitHub fournit des machines
#     de construction gratuites, deja utilisees pour ce depot.
#
# Les valeurs ci-dessous (URL/cle Supabase, code de parrainage, id de
# projet Expo) ne sont PAS des secrets : la cle Supabase est publique
# par construction (elle part dans chaque APK, voir services/supabase.ts),
# et les autres sont des identifiants, pas des mots de passe. Les ecrire
# ici plutot que dans les secrets du depot evite un aller-retour manuel
# sans rien exposer de plus que ce que l'APK contient deja.

name: Construire l'APK Android (Allure)

on:
  workflow_dispatch:
  push:
    branches: ["claude/gold-trading-system-auto-6boe8m"]
    paths: ["app-signaux/**", ".github/workflows/build-android.yml"]

# GITHUB_TOKEN doit pouvoir publier une release (voir la derniere etape) --
# par defaut certains depots ne lui donnent que la lecture.
permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jwksajhtvhwktkbkpits.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_hd3loPAD_x3_D_HPmxekcQ_vvDH0xmm
      BITVAVO_PARRAINAGE: 4BFF5D529C
      EAS_PROJECT_ID: a8ae497e-aec8-4765-a87d-170db17f07eb
      REVENUECAT_ANDROID_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      # AGP (Android Gradle Plugin) recent exige Java 17 -- les images
      # ubuntu-latest de GitHub portent deja le SDK Android complet,
      # aucune installation supplementaire n'est necessaire pour lui.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dependances
        working-directory: app-signaux
        run: npm install

      - name: Generer le projet Android natif
        working-directory: app-signaux
        run: npx expo prebuild --platform android

      # ASSEMBLERELEASE, PAS ASSEMBLEDEBUG -- ERREUR CORRIGEE LE 14 SEPT.
      #
      # Un APK "debug" n'embarque PAS le code JavaScript : il attend une
      # connexion reseau a un serveur Metro sur le poste du developpeur.
      # Installe seul sur un telephone, il plante immediatement avec
      # "Could not connect to development server" -- exactement ce que
      # l'operateur a vu.
      #
      # "release" embarque le JavaScript dans l'APK au moment de la
      # construction (bundleReleaseJsAndAssets), ce qu'il faut pour un
      # fichier autonome. Le template Expo courant configure DEJA le
      # type "release" pour se signer avec la cle de debug par defaut
      # (`android/app/build.gradle`, bloc `buildTypes.release`) tant
      # qu'aucune vraie cle n'est fournie -- verifie en generant le
      # projet localement avant ce correctif. Aucune configuration de
      # signature supplementaire n'est donc necessaire ici.
      - name: Construire l'APK (release, signe par defaut)
        working-directory: app-signaux/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Publier l'APK comme fichier telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: allure-android
          path: app-signaux/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # UNE RELEASE, PAS SEULEMENT UN ARTEFACT.
      #
      # Un artefact GitHub se telecharge en .zip (l'operateur a du
      # extraire l'archive pour trouver l'APK, confusion le 14 sept.) et
      # exige d'etre connecte a GitHub. Une release donne un lien direct
      # vers le fichier .apk lui-meme -- un seul geste sur telephone,
      # comme la page de build Expo avant elle.
      #
      # LE TAG RESTE FIXE ("dernier-build") : la meme URL sert a chaque
      # construction, l'operateur n'a jamais besoin d'un nouveau lien.
      - name: Publier une release avec l'APK (lien stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dernier-build --yes --cleanup-tag || true
          gh release create dernier-build \
            app-signaux/android/app/build/outputs/apk/release/app-release.apk \
            --title "Allure -- derniere construction" \
            --notes "Construit automatiquement depuis le commit ${{ github.sha }}." \
            --prerelease
