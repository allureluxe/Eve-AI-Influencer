name: Luna media tests

on:
  push:
    paths:
      - 'luna/**'
      - 'ops/claude_media.py'
      - 'ops/executer_luna.py'
      - 'ops/instagram.py'
      - 'tests/test_luna_media.py'
      - 'supabase/migrations/20260926033000_luna_media_jobs.sql'
      - '.github/workflows/luna-media-tests.yml'
  pull_request:
    paths:
      - 'luna/**'
      - 'ops/claude_media.py'
      - 'ops/executer_luna.py'
      - 'ops/instagram.py'
      - 'tests/test_luna_media.py'
      - 'supabase/migrations/20260926033000_luna_media_jobs.sql'
      - '.github/workflows/luna-media-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Syntax check
        run: python -m compileall -q luna ops/claude_media.py ops/executer_luna.py ops/instagram.py
      - name: Luna media unit tests
        run: python -m pytest -q tests/test_luna_media.py
