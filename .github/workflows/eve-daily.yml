# Exécution de l'agent Eve sur GitHub.
#
# Déclenchement MANUEL pour l'instant : onglet Actions → « Eve — cycle
# quotidien » → « Run workflow ». Les vidéos produites se téléchargent en
# bas de la page d'exécution (section Artifacts).
#
# Pour passer en automatique, décommenter le bloc `schedule` ci-dessous.
# À ne faire qu'une fois les comptes créés : sans cela, chaque exécution
# produit du contenu que personne ne publie.
#
# Les runners GitHub sont éphémères : la base SQLite et les vidéos sont
# conservées via le cache et les artefacts. Pour un usage durable, un petit
# VPS avec cron reste plus simple.
name: Eve — cycle quotidien

on:
  # schedule:
  #   - cron: "30 10 * * *"   # 06:30 America/New_York (heure d'été)
  #   - cron: "0 22 * * *"    # 18:00 America/New_York
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = ne rien publier"
        default: "1"
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      # `write` est nécessaire pour déposer les MP4 en assets de release.
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Restaurer l'état de l'agent
        uses: actions/cache@v4
        with:
          path: data
          key: eve-state-${{ github.run_id }}
          restore-keys: eve-state-

      - name: Contrôles de conformité
        run: python -m pytest tests -q

      - name: Cycle quotidien
        env:
          # Fournis automatiquement par Actions : ils servent à héberger les
          # MP4 en assets de release, seule URL publique dont Instagram a besoin.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || '1' }}
          REQUIRE_HUMAN_REVIEW: "0"
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'pollinations' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'template' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_DRAFT_MODE: ${{ vars.TIKTOK_DRAFT_MODE || '1' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'gemini' }}
          VOICE_STYLE_PRESET: ${{ vars.VOICE_STYLE_PRESET || 'neutre' }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
          LINKINBIO_URL: ${{ vars.LINKINBIO_URL }}
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
        run: python -m eve.cli run --days 3 --max-publish 2

      - name: Récupérer les vidéos et le rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eve-output-${{ github.run_number }}
          path: |
            output/videos/**/*.mp4
            output/reports/*.md
          retention-days: 14
