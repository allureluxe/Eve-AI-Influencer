<title>Turtle en réel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* Charte ALLURE : noir, jaune, blanc.
   Le jaune ne porte JAMAIS de texte ni de trait fin sur blanc — son
   contraste y vaut 1,3:1. Quand il faut une ligne, c'est --olive :
   le meme jaune pousse au fonce, lisible et de la meme famille. */
:root{
  --ground:#FFFFFF; --surface:#FFFFFF;
  --ink:#15150F; --ink-soft:#55554A; --ink-faint:#8E8E80;
  --line:#15150F; --line-soft:#E9E9DE;
  --jaune:#EFE73C; --jaune-soft:#FCFAD9; --olive:#5C570C;
  --gain:#2C6B3F; --loss:#A8382A;
  --trait:2px;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color-scheme:light; color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px; margin:0 auto; padding:40px 22px 72px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- en-tete ---------- */
header{margin-bottom:34px}
.ligne{display:flex; align-items:center; gap:18px; margin-bottom:12px}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:12px}
.logo{
  flex:0 0 auto; width:96px; height:auto; display:block;
}
@media(max-width:520px){.logo{width:74px} .ligne{gap:13px}}
h1{
  font-family:Fraunces,Georgia,serif; font-weight:600; color:var(--ink);
  font-size:clamp(28px,4.4vw,40px); line-height:1.1; margin:0;
  letter-spacing:-.015em; text-wrap:balance;
}
.periode{color:var(--ink-soft); font-size:14px}
.chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:500;
  background:var(--jaune); color:var(--ink); border:0;
  font-weight:600; letter-spacing:.01em;
}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--ink)}
.chip.warn{background:var(--jaune-soft); color:var(--ink)}

/* ---------- le chiffre principal ---------- */
.tete{
  background:linear-gradient(112deg,var(--jaune) -18%,var(--jaune-soft) 40%,var(--surface) 78%); border:var(--trait) solid var(--line); border-radius:16px;
  padding:28px 30px; margin-bottom:16px;
  display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center;
}
@media(max-width:640px){.tete{grid-template-columns:1fr; gap:22px}}
.eyebrow{
  font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600; margin-bottom:8px;
}
.gros{
  font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:clamp(40px,7vw,58px); font-weight:600; line-height:1;
  letter-spacing:-.03em; color:var(--loss);
}
.gros.pos{color:var(--gain)}
.sous{color:var(--ink-soft); font-size:14px; margin-top:9px}
.contexte{border-left:var(--trait) solid var(--line-soft); padding-left:30px}
@media(max-width:640px){.contexte{border-left:0; border-top:var(--trait) solid var(--line-soft); padding-left:0; padding-top:20px}}
.contexte p{margin:0; font-size:14.5px; color:var(--ink-soft)}
.contexte strong{color:var(--ink); font-weight:600}

/* ---------- bandeau de statistiques ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; margin-bottom:16px}
.stat{background:var(--surface); border:var(--trait) solid var(--line); border-radius:13px;
      padding:15px 17px; position:relative; overflow:hidden}
.stat::before{content:""; position:absolute; inset:0 0 auto 0; height:5px; background:var(--c,var(--jaune))}
.stat .k{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
.stat .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
         font-size:24px; font-weight:600; margin-top:6px; letter-spacing:-.02em}
.stat .d{font-size:12.5px; color:var(--ink-soft); margin-top:3px}

/* ---------- carte generique ---------- */
.carte{background:var(--surface); border:var(--trait) solid var(--line); border-radius:16px;
       padding:26px 28px; margin-bottom:16px}
h2{font-family:Fraunces,Georgia,serif; font-weight:600; font-size:20px; margin:0 0 4px;
   letter-spacing:-.01em; color:var(--ink); display:inline-block; position:relative}
h2::after{content:""; position:absolute; left:0; right:0; bottom:2px; height:8px;
          background:var(--jaune); z-index:-1; border-radius:2px}
.h2note{color:var(--ink-soft); font-size:13.5px; margin:0 0 20px}

/* ---------- graphique ---------- */
.chart{width:100%; height:auto; display:block; overflow:visible}
.legende{display:flex; flex-wrap:wrap; gap:18px; margin-top:14px; font-size:12.5px; color:var(--ink-soft)}
.legende span{display:inline-flex; align-items:center; gap:7px}
.sw{width:18px; height:10px; border-radius:2px; background:var(--jaune);
     border-bottom:3px solid var(--olive)}
/* Deux pastilles en une : la verte, puis la rouge posee par l'ombre. */
.dot{width:9px; height:9px; border-radius:50%; background:var(--gain);
     box-shadow:13px 0 0 0 var(--loss); margin-right:15px}

/* ---------- tableau des trades ---------- */
.tablewrap{overflow-x:auto; margin:0 -28px; padding:0 28px}
table{width:100%; border-collapse:collapse; font-size:14px; min-width:520px}
th{
  text-align:left; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600; padding:0 10px 9px 0;
  border-bottom:var(--trait) solid var(--line);
}
th.r,td.r{text-align:right; padding-right:0}
td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
.sym{font-weight:600; letter-spacing:-.01em}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.bar{position:relative; height:9px; border-radius:5px; background:var(--line-soft); min-width:84px}
.bar i{position:absolute; top:0; height:9px; border-radius:5px; display:block}
.bar .mid{position:absolute; top:-3px; bottom:-3px; width:2px; left:50%;
          background:var(--ink); opacity:.35; border-radius:1px}

/* ---------- lecture ---------- */
.lecture li{margin-bottom:11px}
.lecture li:last-child{margin-bottom:0}
.lecture strong{font-weight:600}
.encart{
  background:var(--jaune-soft); border:var(--trait) solid var(--ink);
  border-radius:11px; padding:15px 18px; margin-top:18px; font-size:14px; color:var(--ink);
}
.encart b{color:var(--ink); background:var(--jaune); padding:1px 5px; border-radius:3px}
footer{color:var(--ink-faint); font-size:12.5px; text-align:center; margin-top:30px}
</style>
