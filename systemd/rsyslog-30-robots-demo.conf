# Les robots de simulation journalisent CHAQUE controle sur CHAQUE crypto
# a chaque cycle : 78 Mo par heure, soit 55 Go par mois. rsyslog en
# faisait une copie dans /var/log/syslog, qui avait atteint 7,6 Go le
# 20 septembre puis 3,8 Go le 21 -- vide deux fois en deux jours.
#
# On coupe la COPIE, pas le journal : `journalctl -u robot-demo` continue
# de tout montrer, avec la rotation automatique de journald qui, elle,
# est bornee. Seul le doublon non borne disparait.
#
# A REVOIR le 28 : baisser le niveau de detail du robot lui-meme traite
# la cause. Ceci ne traite que la consequence la plus couteuse.
if $programname == 'robot-demo' or $programname == 'robot-demo2' then stop
