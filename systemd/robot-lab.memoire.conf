# Plafond du Lab -- decision de l'operateur du 2 oct. 2026 (« limite le lab »).
# Il consommait ~1,1 Go et a sature le serveur de 4 Go avec les deux demos.
# Il doit ceder avant tout le monde : il ne touche ni a l'argent ni aux demos.
# A installer dans /etc/systemd/system/robot-lab.service.d/memoire.conf
[Service]
MemoryHigh=1200M
MemoryMax=1600M
MemorySwapMax=512M
CPUWeight=20
Nice=10
# 2 oct. 2026 : tue 2 fois par son plafond (un an de M15 sur ~200 cryptos).
# Six mois divisent la memoire par deux, assez de recul pour une D1.
Environment=GB_LAB_HISTORY_DAYS=180
