# Plafond du Lab -- decision de l'operateur du 2 oct. 2026 (« limite le lab »).
# Il consommait ~1,1 Go et a sature le serveur de 4 Go avec les deux demos.
# Il doit ceder avant tout le monde : il ne touche ni a l'argent ni aux demos.
# A installer dans /etc/systemd/system/robot-lab.service.d/memoire.conf
[Service]
MemoryHigh=1200M
MemoryMax=1600M
MemorySwapMax=512M
CPUWeight=20
Nice=10
# 2 oct. 2026 : la memoire est tenue par GB_LAB_MAX_BARS (gold_bot/lab.py),
# pas par la periode : 180 jours ne laissaient que 179 bougies D1 et le
# banc ecartait presque toutes les cryptos. Un an de D1 = 365 bougies.
Environment=GB_LAB_HISTORY_DAYS=365
