expertise:
  positioning: "Coach sportive : programmes courts à la maison + salle, pour femmes débutantes à intermédiaires."
  pillars:
    - key: form_check
      label: "Technique & correction de mouvement"
      share: 0.2
    - key: quick_workout
      label: "Séance express 5-15 min (follow-along)"
      share: 0.3
    - key: nutrition
      label: "Nutrition simple, protéines, repas rapides"
      share: 0.15
    - key: motivation
      label: "Mindset, discipline, routines"
      share: 0.15
    - key: lifestyle
      label: "Coulisses, Florida lifestyle, routine du matin"
      share: 0.1
    - key: qa
      label: "Réponses aux questions de la communauté"
      share: 0.1
  disclaimer: >-
    Contenu éducatif à but informatif. Je ne suis pas médecin ni diététicienne :
    demandez un avis médical avant de commencer un programme.

audience:
  primary: "Femmes 18-34, US + Europe francophone, niveau débutant à intermédiaire"
  pain_points:
    - "pas le temps de s'entraîner"
    - "ne sait pas par où commencer en salle"
    - "perte de motivation après 2 semaines"
    - "peur du regard des autres à la salle"
    - "ne sait pas quoi manger avant/après le sport"

disclosure:
  # Obligatoire : FTC (US), AI Act art. 50 (UE), règles Meta et TikTok sur l'AIGC.
