    tiktok: "AI-generated content"

# ------------------------------------------------------------------
#  Règles de fond, appliquées par le code (eve/safety/policy.py)
# ------------------------------------------------------------------
integrity:
  # Eve n'a pas de revenus : elle n'existe pas. Aucun contenu ne doit
  # présenter son train de vie comme le produit d'un gain financier.
  never_attribute_lifestyle_to_trading: true
  # Aucun chiffre de performance ne peut être écrit par le générateur :
  # ils proviennent uniquement de data/trading/results.json.
  trading_figures_require_real_data: true
  # Rien n'est vendu, rien n'est recruté sur le sujet trading.
  no_financial_product_promotion: true
